# Laboratorio de V&V: Jenkins (CI) + SonarQube (calidad).
#
# Va aparte del `docker-compose.yml` de la raíz, que es el del JUEGO (la imagen que se publica y
# el túnel). Estos dos contenedores no se despliegan nunca: viven en la máquina de desarrollo.
#
#   docker compose -f vv/docker-compose.yml up -d
#   Jenkins    → http://localhost:8080
#   SonarQube  → http://localhost:9000   (admin/admin la primera vez)
#
# El repo se monta en solo lectura dentro de Jenkins (/repo-src) y el job clona desde ahí. Clonar
# en vez de construir sobre el propio directorio de trabajo es a propósito: si el pipeline
# ensuciara el árbol del que estás desarrollando, el "pipeline por cada commit" dejaría de ser
# reproducible.

name: bug-vv

services:
  sonarqube:
    image: sonarqube:community
    container_name: bug-sonarqube
    ports:
      - '9000:9000'
    environment:
      # Base H2 embebida: suficiente para un proyecto de este tamaño y evita levantar Postgres.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  jenkins:
    build:
      context: ./jenkins
    container_name: bug-jenkins
    ports:
      - '8080:8080'
      - '50000:50000'
    environment:
      # Sin el asistente de primer arranque: la contraseña y los plugins ya vienen puestos por
      # las Configuration-as-Code / init.groovy de la imagen.
      # `ALLOW_LOCAL_CHECKOUT` hace falta porque el origen del job es `/repo-src`, un directorio
      # montado, y el plugin de Git se niega por defecto a clonar de una ruta local: en un Jenkins
      # compartido, un job podría leer así el espacio de trabajo de otro. Aquí el "otro" no existe
      # —un contenedor en la máquina de desarrollo, con el repo montado en solo lectura— y sin esto
      # la primera construcción muere en el checkout, antes de ejecutar una sola prueba.
      JAVA_OPTS: '-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true'
      # Dentro de la red de compose, SonarQube responde por su nombre de servicio.
      SONAR_HOST_URL: 'http://sonarqube:9000'
      # El token que generó `vv/setup.mjs` en `vv/.env`. Tiene que estar aquí explícitamente:
      # Compose lee ese archivo para interpolar el YAML, pero eso NO mete nada dentro del
      # contenedor. Sin esta línea, `casc.yaml` resuelve `${SONAR_TOKEN:-}` a vacío y la etapa de
      # calidad se salta en cada construcción sin que nadie sepa por qué.
      SONAR_TOKEN: '${SONAR_TOKEN:-}'
    volumes:
      - jenkins_home:/var/jenkins_home
      - ../:/repo-src:ro
    depends_on:
      - sonarqube

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  jenkins_home:
