# Análisis estático del monorepo completo (SonarQube Community).
#
# Se analiza como UN proyecto y no como cuatro: los cuatro workspaces se despliegan juntos en la
# misma imagen y comparten el motor de reglas, así que la duplicación entre `engine` y `net` es
# duplicación de verdad y queremos verla.
#
# Uso:  npm run test:coverage  &&  sonar-scanner
# (la cobertura tiene que existir ANTES del escaneo; el escáner no ejecuta pruebas)

sonar.projectKey=bug-p2p
# Aquí el nombre va en ASCII a propósito, con guion normal y sin acentos. El escáner lee este
# archivo con `java.util.Properties`, que asume ISO-8859-1, así que el guion largo que había antes
# —tres bytes en UTF-8— llegaba al panel convertido en un jeroglífico. Se puede escapar
# (`—`), pero para el nombre de un proyecto no compensa: el ASCII no se rompe nunca.
sonar.projectName=Bug - juego de cartas P2P descentralizado
sonar.projectVersion=1.7.1

sonar.sources=engine/src,net/src,signaling/src,web/app,web/components,web/lib,docker,tools
sonar.tests=engine/test,net/test,signaling/test,web/test,cypress/e2e
sonar.sourceEncoding=UTF-8

# Un solo lcov con rutas relativas al repo, generado por tools/merge-coverage.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=engine/tsconfig.json,net/tsconfig.json,signaling/tsconfig.json,web/tsconfig.json

# Nada que analizar aquí: dependencias, salidas de build y el sprite de cartas (un SVG de 74
# recortes generado por `npm run art`, no código escrito a mano).
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,web/public/**,art/**,vv/informes/**

# Exclusiones de COBERTURA — lo que no miden las unitarias, y por qué:
#  - web/components y web/app: interfaz. La prueban las pruebas funcionales de Cypress contra un
#    navegador real, que es donde han aparecido sus fallos (el lobby que no reabría con StrictMode,
#    la tarjeta que desbordaba a 360 px). Ninguna unitaria habría visto ninguno de los dos.
#  - net/src/room.ts: la mitad de su cuerpo habla con RTCPeerConnection, que no existe en Node. Su
#    lógica sí está cubierta (protocolo, relay, anti-glare) por los tests de malla simulada; el
#    transporte lo cubre Cypress con varios navegadores.
#  - web/lib/pixiEffects.ts: requiere WebGL.
#  - signaling/src/smoke.ts y tools/: utilidades de desarrollo, no van en el despliegue.
sonar.coverage.exclusions=web/components/**,web/app/**,web/lib/pixiEffects.ts,web/lib/useBug*.ts,net/src/room.ts,signaling/src/smoke.ts,tools/**,docker/**,vv/**,cypress/**

# --- Una regla apagada, y por qué -----------------------------------------------------------------
#
# S1135 («completa la tarea de este comentario TODO») busca la palabra TODO en los comentarios. Este
# repositorio está comentado **en castellano**, donde *todo* es una palabra corriente: «todo el
# estado se deriva de una semilla», «la imagen todo-en-uno», «todo lo demás». Se revisaron sus trece
# avisos uno a uno y **los trece eran esa palabra**; ninguno era una tarea pendiente.
#
# Una regla que en este código no puede acertar nunca no protege de nada: solo enseña a mirar el
# panel por encima, que es como se acaban colando los avisos que sí importan. La alternativa —
# reescribir trece comentarios correctos para esquivar una palabra del idioma— empeora el código
# para complacer a la herramienta.
#
# Lo pendiente de verdad no vive en comentarios: está en `PLAN.md`, sección «Pendientes / abiertos».
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# S7767 en el PRNG: «usa Math.trunc en vez de | 0». NO son lo mismo, y aquí la diferencia es el
# sistema entero. `mulberry32` usa `| 0` para **envolver a 32 bits con signo**, que es lo que define
# el algoritmo; `Math.trunc` solo quita decimales y deja crecer el número. Cambiarlo produciría otra
# secuencia: los nodos dejarían de barajar igual a partir de la misma semilla, y con eso se cae el
# estado replicado entero. Fuera del PRNG, los `| 0` que sí eran truncamientos ya se cambiaron.
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S7767
sonar.issue.ignore.multicriteria.e3.resourceKey=engine/src/rng.ts

# S7758 en la huella: «usa codePointAt en vez de charCodeAt». Sería un error. `stateHash` es un
# FNV-1a que recorre la cadena **unidad UTF-16 a unidad**; `codePointAt(i)` devuelve el punto de
# código completo, así que un par suplente —un emoji en el nombre de un jugador— se contaría dos
# veces y con otro valor. La huella es con lo que los nodos comprueban que han convergido: no puede
# depender de cómo estén escritos los nombres.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.e4.resourceKey=net/src/replica.ts

# S2245 («asegúrate de que este generador pseudoaleatorio es seguro aquí») en los efectos visuales.
# Ahí `Math.random` decide dónde nace una chispa, cuánto tarda en caer y de qué color es. No protege
# nada, no lo ve nadie más y no hay nada que adivinar: usar criptografía para colocar una partícula
# sería confundir la herramienta con el problema. Donde el azar SÍ protegía algo —el código de sala,
# que es lo que hace falta para colarse en una partida ajena— se cambió a `crypto`, con pruebas.
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e5.resourceKey=web/lib/pixiEffects.ts

# S2245 en `uid.ts`: ahí el `Math.random` **es** la rama de respaldo. Las dos preferentes usan
# `crypto.randomUUID` y `crypto.getRandomValues`; la tercera solo se alcanza en un navegador sin
# criptografía —anterior a 2011—, que tampoco tiene `RTCPeerConnection` y por tanto no puede entrar
# a una sala. Está para que la página no muera con una excepción, que es lo que hacía antes.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e6.resourceKey=web/lib/uid.ts
